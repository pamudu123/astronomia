[project]
name = "astronomia-agent"
version = "0.1.0"
description = "Astronomia AI assistant: a Deep Agents service that explains engine results in plain words"
requires-python = ">=3.12"
dependencies = [
    "ag-ui-langgraph>=0.0.47",
    "copilotkit>=0.1.97",
    "deepagents>=0.7.38",
    "fastapi[standard]>=0.163.0",
    "httpx>=0.28.1",
    "langchain-openai>=1.8.0",
    "pydantic-settings>=2.16.3",
    "tzdata==2026.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Ships without type information.
module = ["ag_ui_langgraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]
