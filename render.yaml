# Render blueprint for the backend and the AI assistant (staging for now).
# The frontend runs on Vercel and the database on Supabase (docs/19). See docs/09-launch.md.
services:
  - type: web
    name: astronomia-api
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/pamudu123/astronomia
    branch: main
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ASTRONOMIA_ENVIRONMENT
        value: staging
      # Supabase's session pooler connection string (docs/19). Secret: set in the dashboard,
      # never here. The tables come from supabase/migrations/, not from the app.
      - key: ASTRONOMIA_DATABASE_URL
        sync: false
      # The Supabase project, whose public keys check sign in tokens (docs/19). Not secret.
      - key: ASTRONOMIA_SUPABASE_URL
        value: https://ihzvwnwkbcqldhrvsrle.supabase.co
      # Supabase's secret key, only for deleting users from Supabase Auth (docs/19). Secret: set
      # in the dashboard, never here.
      - key: ASTRONOMIA_SUPABASE_SECRET_KEY
        sync: false
      # Shared with the frontend (BACKEND_ACCESS_KEY). Set in the dashboard, never here.
      - key: ASTRONOMIA_ACCESS_KEY
        sync: false
      # Paid reports (docs/18, docs/20): the AI reading, explain buttons, full detail and full
      # PDF only on reports the account unlocked, with a coupon or a payment.
      - key: ASTRONOMIA_PAID_REPORTS
        value: "true"
      # Staging only (owner, 2026-11-24): the mock payment provider, which unlocks reports without
      # money (docs/23). The backend refuses to start with it when the environment is production.
      - key: ASTRONOMIA_PAYMENT_PROVIDER
        value: mock
      # Astro chat limits (docs/21): shared with the assistant (copied below) and Vercel's
      # CHAT_KEY. Secret: set in the dashboard, never here. Empty: no chat limits.
      - key: ASTRONOMIA_CHAT_KEY
        sync: false

  # The AI assistant behind the website's chat (agent/). The chat stays off until Vercel has
  # AGENT_URL, so this service can run before anyone can reach it.
  - type: web
    name: astronomia-agent
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/pamudu123/astronomia
    branch: main
    dockerContext: ./agent
    dockerfilePath: ./agent/Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    # Only changes to the assistant rebuild it.
    buildFilter:
      paths:
        - agent/**
    envVars:
      - key: ASTRONOMIA_AGENT_ENVIRONMENT
        value: staging
      # Set in the dashboard, never here.
      - key: OPENAI_API_KEY
        sync: false
      # Staging uses one access key for the backend and the assistant: the frontend already
      # sends it (BACKEND_ACCESS_KEY), and the assistant already holds it to call the backend.
      - key: ASTRONOMIA_AGENT_ACCESS_KEY
        fromService:
          type: web
          name: astronomia-api
          envVarKey: ASTRONOMIA_ACCESS_KEY
      # The backend's public address, the same as Vercel's BACKEND_URL. Free services can't
      # take calls over Render's private network, so the agent uses the public one.
      - key: ASTRONOMIA_AGENT_BACKEND_URL
        value: https://astronomia-api-njxu.onrender.com
      - key: ASTRONOMIA_AGENT_BACKEND_ACCESS_KEY
        fromService:
          type: web
          name: astronomia-api
          envVarKey: ASTRONOMIA_ACCESS_KEY
      # Chat limits (docs/21): only questions the backend allowed are answered.
      - key: ASTRONOMIA_AGENT_CHAT_KEY
        fromService:
          type: web
          name: astronomia-api
          envVarKey: ASTRONOMIA_CHAT_KEY
