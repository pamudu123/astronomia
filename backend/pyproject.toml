[project]
name = "astronomia-backend"
version = "0.1.0"
description = "Astronomia API: hadahan (birth chart) and porondam (marriage matching)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "geonamescache==3.0.2",
    "pydantic-settings>=2.4",
    "pyswisseph==2.10.3.2",
    "pyyaml>=6.0.3",
    "tzdata==2026.6",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "astropy>=8.0.2",
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261111",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# pyswisseph and astropy ship without type information.
module = ["swisseph", "astropy.*", "erfa"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
