[project]
name = "astronomia-backend"
version = "0.1.0"
description = "Astronomia API: hadahan (birth chart) and porondam (marriage matching)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "geonamescache==3.0.2",
    "pydantic-settings>=2.4",
    "tzdata==2026.6",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
