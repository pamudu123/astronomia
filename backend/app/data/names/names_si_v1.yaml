# Names for the starting letters. PROVISIONAL: the Sinhala spellings and meanings need a check
# by a native speaker. Sources and licences: docs/12-baby-rules.md, section 7.
#
# Each name says where it came from:
#   source wikipedia_name: the name has its own page in Wikipedia's Sinhalese given names categories.
#   source wikipedia_person: added by us; the url is a Wikipedia article about a Sri Lankan person
#     with this name, to show it is a name in real use.
#   meaning_from wikipedia: the meaning is the one the Wikipedia name page gives (CC BY-SA 4.0).
#   meaning_from astronomia: our own short meaning, from the Sanskrit, Pali or Sinhala root words.
# Every string is quoted, so YAML never reads a name such as No as true or false.
version: names_si_v1
provisional: true
sources:
  wikipedia_name:
    name: "Wikipedia, Category:Sinhalese given names (and its masculine, feminine and unisex categories)"
    url: "https://en.wikipedia.org/wiki/Category:Sinhalese_given_names"
    licence: "CC BY-SA 4.0. We take the name, its gender category and, for six names, the stated meaning, and link each page."
    read: "2026-11-13"
  wikipedia_person:
    name: "Wikipedia articles about Sri Lankan people"
    url: "https://en.wikipedia.org/"
    licence: "Only the fact that the name is in use is taken. Each name links the article."
    read: "2026-11-13"
  astronomia:
    name: "Astronomia editors"
    licence: "Our own work: the Sinhala spellings of names added by us, and the meanings marked astronomia."
