# Sinhala and Tamil New Year (Avurudu). PROVISIONAL. Sources in docs/11-nakath-rules.md.
#
# Only two things are calculated: the dawn of the new year (the Sun entering Mesha) and the
# punya kalaya around it. Every other nakath is chosen each year by the national nakath
# committee, so it is published only from the official list below, never calculated.
version: avurudu_v1
provisional: true

# Punya kalaya: this many minutes either side of the dawn (6 hours 24 minutes).
# Every official list from 2022 to 2027 fits this exactly.
punya_kalaya_minutes: 384

# Official times are standard Sri Lanka clock time and hold everywhere in Sri Lanka.
timezone: Asia/Colombo

# Official lists. Times are Sri Lanka time. `date` alone means the item has no time.
# colour and direction are keys with names in the label files.
years:
  2022:
    source: "Department of Cultural Affairs list, as reported by Ada Derana on 13 April 2022"
    url: "https://www.adaderana.lk/news/81800"
    items:
      - {key: dawn, at: "2022-04-14 08:41"}
      - {key: punya_kalaya, start: "2022-04-14 02:17", end: "2022-04-14 15:05"}
      - {key: cooking, at: "2022-04-14 09:05", colour: light_gold, direction: east}
      - {key: work_meals, at: "2022-04-14 10:17", colour: light_gold, direction: east}
      - {key: anointing_oil, at: "2022-04-17 07:04", colour: red_and_yellow, direction: south}
      - {key: leaving_for_work, at: "2022-04-18 06:51", colour: white, direction: east}
      - {key: planting, at: "2022-04-18 11:16", colour: white, direction: east}
