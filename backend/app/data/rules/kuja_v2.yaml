# Kuja dosha rules, version 2.
#
# Confirmed by a practising astrologer. Sources disagree on the house list and on
# cancellations (see docs/03-porondam-domain-notes.md).
# Every result carries this version and the provisional flag.
#
# Version 2 keeps the four rules of version 1 and adds three that B. V. Raman gives (Muhurtha,
# pp. 53-54): Mars in Simha or Kumbha ("In Aquarius and Leo, Mars produces no dosha
# whatsoever"), Mars with the Moon ("conjunction of Mars and Jupiter or Mars and the Moon"),
# and Jupiter or Venus in the lagna. Mars with Jupiter is covered by jupiter_aspects_mars,
# which counts Jupiter in the same sign.
#
# Open questions for the astrologer, where Raman and the Sri Lankan Daily Mirror columns
# (agent/skills/birth-chart/reference.md, section 6) disagree: Raman has no cancellation for
# Mars in its own or exalted sign, counts Jupiter by conjunction only (not aspect), and has no
# lagna Kataka/Simha rule; the Daily Mirror gives own sign, Makara, Simha and Jupiter's aspect.

version: kuja_v2
provisional: false

# Mars in one of these houses, counted from each point, counts as Kuja dosha.
# Raman counts only 2, 4, 7, 8 and 12, weakest from the lagna and strongest from Venus. The
# 1st house stays until the astrologer decides.
houses: [1, 2, 4, 7, 8, 12]
points: [lagna, moon, venus]

# Conditions that reduce or cancel the dosha. Each is checked against the chart.
cancellations:
  - id: lagna_kataka_simha
    type: lagna_in_signs
    signs: [kataka, simha]
  - id: mars_own_or_exalted
    type: mars_in_signs
    signs: [mesha, vrischika, makara]
  - id: jupiter_aspects_mars
    type: jupiter_aspects_mars
  - id: mars_house_sign_exception
    type: mars_house_sign
    # House counted from the lagna, and the signs where Mars there is not counted.
    pairs:
      - {house: 2, signs: [mithuna, kanya]}
      - {house: 4, signs: [mesha, vrischika]}
      - {house: 7, signs: [kataka, makara]}
      - {house: 8, signs: [dhanu, meena]}
      - {house: 12, signs: [vrishabha, tula]}
  - id: mars_with_moon
    type: mars_with
    bodies: [moon]
  - id: mars_simha_kumbha
    type: mars_in_signs
    signs: [simha, kumbha]
  - id: benefic_in_lagna
    type: bodies_in_lagna
    bodies: [jupiter, venus]
