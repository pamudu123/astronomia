# Sinhala porondam rules, version 2.
#
# 15 of the traditional 20 factors. Version 1 had 11; this adds Gothra, Pakshi, Linga and
# Dina (the birth weekdays). The names of all 20 and the rule for each added factor follow
# the published descriptions on Sri Lankan porondam sites (purahada.lk, porondam.lk,
# kendra.lk). The tables of the added factors were read from purahada.lk's porondam results
# for test births, and each rule was checked against every result we saw (see
# docs/03-porondam-domain-notes.md). Not yet confirmed by a practising astrologer.
#
# Still missing: Varna, Bhutha, Vruksha, Ayusha and Graha.
#
# "count" is the groom's star counted from the bride's star, both included (1 to 27).
# "sign_count" is the groom's Moon sign counted from the bride's (1 to 12).
# "weekday_count" is the groom's birth weekday counted from the bride's, both included (1 to 7).

version: porondam_si_v2
provisional: true

tables:
  gana:
    deva: [ashwini, mrigashira, punarvasu, pushya, hasta, swati, anuradha, shravana, revati]
    manushya: [bharani, rohini, ardra, purva_phalguni, uttara_phalguni, purva_ashadha, uttara_ashadha, purva_bhadrapada, uttara_bhadrapada]
    rakshasa: [krittika, ashlesha, magha, chitra, vishakha, jyeshtha, mula, dhanishta, shatabhisha]
  yoni:
    horse: [ashwini, shatabhisha]
    elephant: [bharani, revati]
    goat: [krittika, pushya]
    snake: [rohini, mrigashira]
    dog: [ardra, mula]
    cat: [punarvasu, ashlesha]
    rat: [magha, purva_phalguni]
    cow: [uttara_phalguni, uttara_bhadrapada]
    buffalo: [hasta, swati]
    tiger: [chitra, vishakha]
    deer: [anuradha, jyeshtha]
    monkey: [purva_ashadha, shravana]
    mongoose: [uttara_ashadha]
    lion: [dhanishta, purva_bhadrapada]
  nadi:
    aadi: [ashwini, ardra, punarvasu, uttara_phalguni, hasta, jyeshtha, mula, shatabhisha, purva_bhadrapada]
    madhya: [bharani, mrigashira, pushya, purva_phalguni, chitra, anuradha, purva_ashadha, dhanishta, uttara_bhadrapada]
    antya: [krittika, rohini, ashlesha, magha, swati, vishakha, uttara_ashadha, shravana, revati]
  rajju:
    pada: [ashwini, ashlesha, magha, jyeshtha, mula, revati]
    kati: [bharani, pushya, purva_phalguni, anuradha, purva_ashadha, uttara_bhadrapada]
    nabhi: [krittika, punarvasu, uttara_phalguni, vishakha, uttara_ashadha, purva_bhadrapada]
    kantha: [rohini, ardra, hasta, swati, shravana, shatabhisha]
    shiro: [mrigashira, chitra, dhanishta]

  # The seven sages, four stars each in the 28 star count (Abhijit lies between Uttara
  # Ashadha and Shravana, so Pulaha has three of the 27 birth stars).
  gothra:
    marichi: [ashwini, bharani, krittika, rohini]
    atri: [mrigashira, ardra, punarvasu, pushya]
    vasishta: [ashlesha, magha, purva_phalguni, uttara_phalguni]
    angirasa: [hasta, chitra, swati, vishakha]
    pulasthi: [anuradha, jyeshtha, mula, purva_ashadha]
    pulaha: [uttara_ashadha, shravana, dhanishta]
    kratu: [shatabhisha, purva_bhadrapada, uttara_bhadrapada, revati]
  pakshi:
    eagle: [ashwini, bharani, krittika, rohini, mrigashira]
    owl: [ardra, punarvasu, pushya, ashlesha, magha, purva_phalguni]
    crow: [uttara_phalguni, hasta, chitra, swati, vishakha]
    cock: [anuradha, jyeshtha, mula, purva_ashadha, uttara_ashadha, shravana]
    peacock: [dhanishta, shatabhisha, purva_bhadrapada, uttara_bhadrapada, revati]
  linga:
    male: [ashwini, bharani, rohini, ardra, punarvasu, pushya, magha, chitra, swati, jyeshtha, shravana, purva_bhadrapada, uttara_bhadrapada]
    female: [krittika, ashlesha, purva_phalguni, uttara_phalguni, hasta, vishakha, anuradha, purva_ashadha, uttara_ashadha, dhanishta, revati]
    neuter: [mrigashira, mula, shatabhisha]

# Natural friendship between planets: who each planet counts as an enemy.
enemies:
  sun: [venus, saturn]
  moon: []
  mars: [mercury]
  mercury: [moon]
  jupiter: [mercury, venus]
  venus: [sun, moon]
  saturn: [sun, moon, mars]

# Signs each sign holds in vashya (control).
vashya:
  mesha: [simha, vrischika]
  vrishabha: [kataka, tula]
  mithuna: [kanya]
  kataka: [vrischika, dhanu]
  simha: [tula]
  kanya: [mithuna, meena]
  tula: [kanya, makara]
  vrischika: [kataka]
  dhanu: [meena]
  makara: [mesha, kumbha]
  kumbha: [mesha]
  meena: [makara]

factors:
  - {id: dina, type: count_mod, mod: 9, pass: [2, 4, 6, 8, 0]}
  - id: gana
    type: group_pairs
    table: gana
    pass: [[deva, deva], [manushya, manushya], [rakshasa, rakshasa], [deva, manushya]]
  - {id: mahendra, type: count_in, pass: [4, 7, 10, 13, 16, 19, 22, 25]}
  - {id: stree_deergha, type: count_above, threshold: 13}
  - id: yoni
    type: group_avoid
    table: yoni
    fail: [[cow, tiger], [elephant, lion], [horse, buffalo], [dog, deer], [snake, mongoose], [monkey, goat], [cat, rat]]
  - {id: rashi, type: sign_count_avoid, fail: [2, 6, 8, 12]}
  - {id: rashyadhipathi, type: lords_friendly}
  - {id: vashya, type: sign_vashya}
  - id: gothra
    type: group_different
    table: gothra
  - id: pakshi
    type: group_avoid
    table: pakshi
    # The owl is the enemy of every other bird, and the eagle of the cock and the peacock.
    fail: [[owl, eagle], [owl, crow], [owl, cock], [owl, peacock], [eagle, cock], [eagle, peacock]]
  - id: linga
    type: group_pairs_ordered
    table: linga
    # Bride first. A female bride with a male groom is best; two female stars also agree.
    # A neuter star with a female one counts as partly agreeing.
    pass: [[female, male], [female, female], [female, neuter], [neuter, female]]
  - id: weekday
    type: weekday_count_avoid
    # The groom born on the weekday one or two days before the bride's does not agree.
    fail: [6, 7]
  - {id: nadi, type: group_different, table: nadi}
  - {id: rajju, type: group_different, table: rajju, hard: true}
  - id: vedha
    type: star_pairs_avoid
    hard: true
    fail:
      - [ashwini, jyeshtha]
      - [bharani, anuradha]
      - [krittika, vishakha]
      - [rohini, swati]
      - [ardra, shravana]
      - [punarvasu, uttara_ashadha]
      - [pushya, purva_ashadha]
      - [ashlesha, mula]
      - [magha, revati]
      - [purva_phalguni, uttara_bhadrapada]
      - [uttara_phalguni, purva_bhadrapada]
      - [hasta, shatabhisha]
      - [mrigashira, dhanishta]
      - [mrigashira, chitra]
      - [chitra, dhanishta]
