    - {letter: "නු", latin: Nu, others: []}
    - {letter: "නෙ", latin: Ne, others: []}
  jyeshtha:
    - {letter: "නො", latin: No, others: []}
    - {letter: "ය", latin: Ya, others: []}
    - {letter: "යි", latin: Yi, others: []}
    - {letter: "යු", latin: Yu, others: []}
  mula:
    - {letter: "යෙ", latin: Ye, others: []}
    - {letter: "යො", latin: Yo, others: []}
    - {letter: "බ", latin: Ba, others: ["ඔ"]}
    - {letter: "බි", latin: Bi, others: ["ඕ"]}
  purva_ashadha:
    - {letter: "බු", latin: Bu, others: []}
    - {letter: "ධ", latin: Dha, others: []}
    - {letter: "එ", latin: E, others: ["භ"]}
    - {letter: "ඪ", latin: Dha, others: ["ඵ"]}
  uttara_ashadha:
    - {letter: "බෙ", latin: Be, others: []}
    - {letter: "බො", latin: Bo, others: []}
    - {letter: "ජ", latin: Ja, others: []}
    - {letter: "ජි", latin: Ji, others: ["පි"]}
  shravana:
    - {letter: "ජු", latin: Ju, others: []}
    - {letter: "ජෙ", latin: Je, others: []}
    - {letter: "ජො", latin: Jo, others: []}
