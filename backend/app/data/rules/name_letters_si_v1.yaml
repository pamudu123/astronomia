# Starting letters (akuru) for a name, from the birth star (nakatha) and its pada.
# PROVISIONAL until a practising astrologer confirms it. Sources and choices: docs/12-baby-rules.md.
#
# Each pada has one letter, chosen by the majority of three Sri Lankan sources: lankahandahana.com
# (read back from 108 made-up births), laksara.com and Lankadeepa. Where all three differ, the classical
# Indian table breaks the tie. `others` lists what the other sources give, for the astrologer.
version: name_letters_si_v1
provisional: true

stars:
  ashwini:
    - {letter: "චූ", latin: Choo, others: ["චු"]}
    - {letter: "චෙ", latin: Che, others: []}
    - {letter: "චො", latin: Cho, others: []}
    - {letter: "ල", latin: La, others: []}
  bharani:
    - {letter: "ලි", latin: Li, others: []}
    - {letter: "ලු", latin: Lu, others: []}
    - {letter: "ලෙ", latin: Le, others: []}
    - {letter: "ලො", latin: Lo, others: []}
  krittika:
    - {letter: "අ", latin: A, others: []}
    - {letter: "ඉ", latin: I, others: []}
    - {letter: "උ", latin: U, others: []}
    - {letter: "එ", latin: E, others: []}
  rohini:
    - {letter: "ඔ", latin: O, others: []}
    - {letter: "ව", latin: Va, others: ["ච"]}
    - {letter: "වි", latin: Vi, others: ["චි"]}
    - {letter: "වු", latin: Vu, others: ["චු"]}
  mrigashira:
    - {letter: "වෙ", latin: Ve, others: ["චෙ"]}
    - {letter: "වො", latin: Vo, others: ["චො"]}
    - {letter: "ක", latin: Ka, others: []}
    - {letter: "කි", latin: Ki, others: []}
  ardra:
    - {letter: "කු", latin: Ku, others: []}
    - {letter: "ඝ", latin: Gha, others: ["ස"]}
    - {letter: "ඞ", latin: Nga, others: ["ධ"]}
    - {letter: "ඡ", latin: Chha, others: ["ච", "ජ"]}
  punarvasu:
    - {letter: "කෙ", latin: Ke, others: []}
    - {letter: "කො", latin: Ko, others: []}
    - {letter: "හ", latin: Ha, others: []}
    - {letter: "හි", latin: Hi, others: []}
  pushya:
    - {letter: "හු", latin: Hu, others: ["හූ"]}
    - {letter: "හෙ", latin: He, others: []}
    - {letter: "හො", latin: Ho, others: []}
    - {letter: "ඩ", latin: Da, others: []}
  ashlesha:
    - {letter: "ඩි", latin: Di, others: []}
    - {letter: "ඩු", latin: Du, others: []}
    - {letter: "ඩෙ", latin: De, others: []}
    - {letter: "ඩො", latin: Do, others: []}
  magha:
    - {letter: "ම", latin: Ma, others: []}
    - {letter: "මි", latin: Mi, others: ["මී"]}
    - {letter: "මු", latin: Mu, others: ["මූ"]}
    - {letter: "මෙ", latin: Me, others: []}
  purva_phalguni:
    - {letter: "මො", latin: Mo, others: []}
    - {letter: "ට", latin: Ta, others: ["ම"]}
    - {letter: "ටි", latin: Ti, others: []}
    - {letter: "ටු", latin: Tu, others: []}
  uttara_phalguni:
    - {letter: "ටෙ", latin: Te, others: []}
    - {letter: "ටො", latin: To, others: []}
    - {letter: "ප", latin: Pa, others: []}
    - {letter: "පි", latin: Pi, others: ["කි"]}
  hasta:
    - {letter: "පු", latin: Pu, others: []}
    - {letter: "ෂ", latin: Sha, others: ["ස"]}
    - {letter: "ණ", latin: Na, others: []}
    - {letter: "ඨ", latin: Tha, others: ["ධි"]}
  chitra:
    - {letter: "පෙ", latin: Pe, others: []}
    - {letter: "පො", latin: Po, others: []}
    - {letter: "ර", latin: Ra, others: []}
