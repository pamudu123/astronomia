  dhanishta:
    - {letter: "ග", latin: Ga, others: ["ගැ"]}
    - {letter: "ගි", latin: Gi, others: []}
    - {letter: "ගු", latin: Gu, others: []}
    - {letter: "ගෙ", latin: Ge, others: []}
  shatabhisha:
    - {letter: "ගො", latin: Go, others: []}
    - {letter: "ස", latin: Sa, others: []}
    - {letter: "සි", latin: Si, others: []}
    - {letter: "සු", latin: Su, others: []}
  purva_bhadrapada:
    - {letter: "සෙ", latin: Se, others: []}
    - {letter: "සො", latin: So, others: []}
    - {letter: "ද", latin: Da, others: []}
    - {letter: "දි", latin: Di, others: []}
  uttara_bhadrapada:
