    - {letter: "චි", latin: Chi, others: []}

# Letters some families also use: by the birth lagna and by the birth weekday (counted from sunrise).
# From laksara.com, which follows the classical consonant groups. Lankadeepa gives the same groups
# with a few misprints (docs/12).
lagna:
  mesha: ["අ", "ආ", "ශ"]
  vrishabha: ["ඉ", "ඊ", "උ", "ෂ"]
  mithuna: ["ඌ", "ඍ", "ඎ", "ස"]
  kataka: ["ග", "ඝ", "එ", "හ"]
  simha: ["ඓ", "ඔ", "ඖ", "ළ"]
  kanya: ["අං", "අඃ"]
  tula: ["ක", "ඛ", "ග", "ඝ", "ඞ"]
  vrischika: ["ච", "ඡ", "ජ", "ඣ", "ඤ"]
  dhanu: ["ට", "ඨ", "ඩ", "ඪ", "ණ"]
  makara: ["ත", "ථ", "ධ", "ද", "න"]
  kumbha: ["ප", "ඵ", "බ", "භ", "ම"]
  meena: ["ය", "ර", "ල", "ව"]
weekday:
  sunday: ["අ", "ඉ", "උ", "එ", "ඔ"]
  monday: ["ය", "ර", "ල", "ව", "ශ", "ෂ", "ස", "හ", "ළ"]
  tuesday: ["ක", "ඛ", "ග", "ඝ", "ඬ"]
  wednesday: ["ට", "ඨ", "ඩ", "ඪ", "ණ"]
  thursday: ["ත", "ථ", "ද", "ධ", "න"]
  friday: ["ච", "ඡ", "ජ", "ඣ", "ඤ"]
  saturday: ["ප", "ඵ", "බ", "භ", "ම"]
