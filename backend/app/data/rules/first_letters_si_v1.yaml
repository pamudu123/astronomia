# First letters ceremony (akuru kiyaweema): good dates and times for a child's first letters.
# PROVISIONAL until a practising astrologer confirms it. Sources and conflicts are in
# docs/11-nakath-rules.md (section 7). A1 is porondam.lk's akuru kiyaweema guide, A2 and A3 the
# Divaina weekly nakath columns, A4 a Lankadeepa column, A5 a kaladasava.com article, and A6 to A8
# the Indian vidyarambha pages (drikpanchang.com, dekhopanchang.com, astromedha.in).
version: first_letters_si_v1
provisional: true

# How far ahead the family may search, in months.
search_months: [1, 3, 6]
# Suggestions: the best day in each week, then the best of those.
suggestions: 12
# Shortest time window worth suggesting, in minutes.
min_window_minutes: 15
# Steps when scanning a day, in minutes. Window edges are then found to the minute.
step_minutes: 5

# A1's twelve nakathas. A4 and A2 used Mrigashira and Pushya. A6 to A8 agree on most of them;
# A6 to A8 also name Dhanishta, and A6 allows many more.
nakatha: [ashwini, rohini, mrigashira, punarvasu, pushya, hasta, chitra, swati, anuradha,
          shravana, shatabhisha, revati]

# A1: Wednesday, Thursday and Friday. A7 and A8: Wednesday and Thursday best, Monday and Friday
# close behind. A2 and A4 used a Monday with a special yoga. A6 also allows Sunday.
good_weekday: [wednesday, thursday, friday]
weak_weekday: [monday, sunday]
# Every source that names them avoids Tuesday and Saturday.
avoid_weekday: [tuesday, saturday]

# Thithi numbers count 1 to 30: 1 to 15 bright half (15 full moon), 16 to 30 dark half
# (30 new moon). A6 to A8: the rikta thithis (4, 9, 14 of each half) and the new moon are avoided.
avoid_thithi: [4, 9, 14, 19, 24, 29, 30]
# Not in A6's or A7's good lists.
weak_thithi: [8, 13, 15, 23, 28]
# A6 to A8: the bright half is preferred.
prefer_bright_half: true
avoid_karana: [vishti]  # A7, and the wedding rules
weak_yoga: [vyatipata, vaidhriti]  # A7

# Tara bala from the child's birth star: the day's star counted from it, in nines.
# A1, A2 and A4 leave out every star that gives 1 Janma, 3 Vipat, 5 Pratyari or 7 Vadha.
avoid_tara: [1, 3, 5, 7]

# A1 asks for a dual (ubhaya) lagna; A2 and A4 name Mithuna and Kanya. A6 avoids the fixed lagnas.
lagna: [mithuna, kanya, dhanu, meena]
# A1 and A6: no planet in the 8th house from the lagna.
eighth_house_empty: true

avoid_rahu_kalaya: true  # A8 and A7, and Sri Lankan practice
daylight_only: true
# A2, A3 and A4 all give an early morning time. Mornings come first.
morning_until: "12:00"

# The age most sources give. Shown as a note, never used to hide a date.
# A1: before the 5th birthday. A4: between 2 and 3. A5: the classical texts say the 5th year.
# A7: 3 to 5.
age_years: {from: 2, to: 5}
