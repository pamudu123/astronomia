reason:
  kuja_present: "{point} ගණන් කළ විට කුජ {house} භාවයේ සිටී."
  kuja_absent: "ලග්නය, චන්ද්‍රයා හෝ සිකුරු සිට ගණන් කළ විට කුජ දෝෂ ඇති කරන භාවයක නැත."
  kuja_reduced: "එය අඩු කරන සමහර කරුණු අදාළ වේ. ජ්‍යොතිෂවේදියෙකු මෙය සලකා බැලිය යුතුය."
  kuja_cancel_lagna_kataka_simha: "ලග්නය {sign} වන අතර, එහිදී කුජ යහපත් ග්‍රහයෙකු ලෙස සැලකේ."
  kuja_cancel_mars_own_or_exalted: "කුජ {sign} රාශියේ, එනම් ස්වක්ෂේත්‍ර හෝ උච්ච රාශියක සිටී."
  kuja_cancel_jupiter_aspects_mars: "{jupiter_sign} රාශියේ ගුරු, {mars_sign} රාශියේ කුජ දෙස බලයි."
  kuja_cancel_mars_house_sign_exception: "{sign} රාශියේ {house} භාවයේ කුජ ගණන් නොකෙරේ."
  kuja_not_lagna_kataka_simha: "ලග්නය {sign} වේ."
  kuja_not_mars_own_or_exalted: "කුජ {sign} රාශියේ සිටී. එය ස්වක්ෂේත්‍ර හෝ උච්ච රාශියක් නොවේ."
  kuja_not_jupiter_aspects_mars: "{jupiter_sign} රාශියේ ගුරු, {mars_sign} රාශියේ කුජ දෙස නොබලයි."
  kuja_not_mars_house_sign_exception: "මෙම ව්‍යතිරේකය {sign} රාශියේ {house} භාවයේ කුජට අදාළ නොවේ."
  time_stable: "උපන් වේලාව විනාඩි 15 කින් වෙනස් වුවත් ලග්නය සහ නැකත එලෙසම පවතී."
  time_lagna: "උපන් වේලාව විනාඩි {minutes} කින් වෙනස් වුවහොත් ලග්නය වෙනස් වේ. වේලාව පරීක්ෂා කරන්න."
  time_nakshatra: "උපන් වේලාව විනාඩි {minutes} කින් වෙනස් වුවහොත් නැකත වෙනස් වේ."

