  rashi_pass: "මනාලයාගේ චන්ද්‍ර රාශිය මනාලියගේ රාශියේ සිට {count} වැන්නයි. එය යහපත්ය."
  rashi_fail: "මනාලයාගේ චන්ද්‍ර රාශිය මනාලියගේ රාශියේ සිට {count} වැන්නයි. එය අපහසු දුරකි."
  rashyadhipathi_pass: "මනාලියගේ රාශියේ අධිපති {bride_lord} ද මනාලයාගේ රාශියේ අධිපති {groom_lord} ද වේ. ඔවුන් සතුරන් නොවේ."
  rashyadhipathi_fail: "මනාලියගේ රාශියේ අධිපති {bride_lord} ද මනාලයාගේ රාශියේ අධිපති {groom_lord} ද වේ. ඔවුන් සතුරන් ලෙස සැලකේ."
  vashya_pass: "{bride_sign} සහ {groom_sign} යන රාශි දෙකෙන් එකක් අනෙකේ බලපෑමට යටත්ය."
  vashya_fail: "{bride_sign} සහ {groom_sign} යන රාශි දෙකෙන් කිසිවක් අනෙකේ බලපෑමට යටත් නොවේ."
  nadi_pass: "මනාලිය {bride_nadi} නාඩියට ද මනාලයා {groom_nadi} නාඩියට ද අයත් වේ. වෙනස් නාඩි යහපත්ය."
  nadi_fail: "දෙදෙනාම {bride_nadi} නාඩියට අයත් වේ. එකම නාඩිය යහපත් නොවේ."
  rajju_pass: "මනාලියගේ නැකත {bride_rajju} රජ්ජුවේ ද මනාලයාගේ නැකත {groom_rajju} රජ්ජුවේ ද වේ. වෙනස් රජ්ජු අත්‍යවශ්‍යයි."
  rajju_fail: "නැකැත් දෙකම {bride_rajju} රජ්ජුවේ වේ. මෙම අත්‍යවශ්‍ය පරීක්ෂාව සමත් නොවේ."
  vedha_pass: "{bride_star} සහ {groom_star} එකිනෙකාට පීඩා කරන යුගලයක් නොවේ."
  vedha_fail: "{bride_star} සහ {groom_star} එකිනෙකාට පීඩා කරන යුගලයකි. මෙම අත්‍යවශ්‍ය පරීක්ෂාව සමත් නොවේ."
  summary_majority_pass: "කරුණුවලින් අඩකට වඩා ගැළපෙන අතර අත්‍යවශ්‍ය පරීක්ෂා දෙකම සමත් වේ."
  summary_minority_pass: "අත්‍යවශ්‍ය පරීක්ෂා දෙකම සමත් වුවත්, ගැළපෙන්නේ කරුණුවලින් අඩකට වඩා අඩුවෙනි."
  summary_essential_fail: "අත්‍යවශ්‍ය පරීක්ෂාවක් සමත් නොවේ. ගණන කුමක් වුවත් සම්ප්‍රදාය මෙය බරපතල ලෙස සලකයි."
  same_star: "දෙදෙනාටම එකම උපන් නැකත ඇත. මේ ගැන සම්ප්‍රදායන් වෙනස් බැවින් ජ්‍යොතිෂවේදියෙකු මෙය සලකා බැලිය යුතුය."
  kuja_both: "කේන්දර දෙකේම කුජ දෝෂය පෙනෙන බැවින්, ඒවා එකිනෙක සමබර කරන ලෙස බොහෝ විට සැලකේ."
  kuja_neither: "කේන්දර දෙකේම කුජ දෝෂය නොපෙනේ."
  kuja_bride_only: "මනාලියගේ කේන්දරයේ කුජ දෝෂය පෙනෙන නමුත් මනාලයාගේ කේන්දරයේ නොපෙනේ. මෙය සලකා බැලිය යුතු කරුණකි."
  kuja_groom_only: "මනාලයාගේ කේන්දරයේ කුජ දෝෂය පෙනෙන නමුත් මනාලියගේ කේන්දරයේ නොපෙනේ. මෙය සලකා බැලිය යුතු කරුණකි."
