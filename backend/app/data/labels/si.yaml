    dawn: {name: "අලුත් අවුරුදු උදාව", text: "සූර්යයා මේෂ රාශියට පිවිසෙයි, අලුත් අවුරුද්ද උදා වේ."}
    punya_kalaya: {name: "පුණ්‍ය කාලය (නොනගතය)", text: "සියලු වැඩ අත්හැර ආගමික වතාවත්වල යෙදීම මැනවි. ආහාර පිසීම, වැඩ ඇල්ලීම හා අනුභවය අලුත් අවුරුද්ද උදා වූ පසු එහි අපර කොටසේ යෙදේ."}
    cooking: {name: "ආහාර පිසීම", text: "ළිප් බැඳ ගිනි මොළවා කිරිබත් හා කැවිලි පිළියෙළ කිරීම මැනවි."}
    work_meals: {name: "වැඩ ඇල්ලීම, ගනුදෙනු කිරීම හා ආහාර අනුභවය", text: "සියලු වැඩ අල්ලා ගනුදෙනු කොට ආහාර අනුභව කිරීම මැනවි."}
    anointing_oil: {name: "හිසතෙල් ගෑම", text: "හිසට තෙල් ගා ස්නානය කිරීම මැනවි."}
