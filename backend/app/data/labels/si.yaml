avurudu:
  dress: "{colour} පැහැති වස්ත්‍රාභරණයෙන් සැරසී {direction} දිශාව බලා කිරීම මැනවි."
  note_moment: "නිල නැකත් වේලාවන් ශ්‍රී ලංකා වේලාවෙනි. විදෙස් රටවලදී එම මොහොතම ඔබේ ඔරලෝසුවේ වේලාවෙන් දැක්වේ."
  note_official: "මෙය ජාතික නැකත් කමිටුවේ නිල නැකත් සීට්ටුවයි."
  note_calculated: "මෙම වසරට නිල නැකත් සීට්ටුවක් තවම නැත. පෙන්වන්නේ අප ගණනය කළ අලුත් අවුරුදු උදාව සහ පුණ්‍ය කාලය පමණි. ඒවා නිල නොවේ."
  item:
