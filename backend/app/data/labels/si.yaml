  pass_nakatha: "චන්ද්‍රයා {nakatha} නැකතේ සිටී. එය මෙම චාරිත්‍රයට සුදුසු නැකතකි."
  pass_thithi: "{thithi} මග හැරිය යුතු තිථියක් නොවේ (එක් එක් පක්ෂයේ 4, 9, 14 සහ අමාවක)."
  pass_weekday: "{weekday} මේ සඳහා සුදුසු දිනයකි."
