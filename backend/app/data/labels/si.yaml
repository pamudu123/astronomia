# එක් එක් භාවයෙන් දැක්වෙන දේ, 1 සිට 12 දක්වා. තාවකාලිකයි: ජ්‍යොතිෂවේදියාගේ තහවුරු කිරීමට.
house_theme:
  - ඔබ සහ ඔබ යමක් ආරම්භ කරන ආකාරය
  - පවුල, කථනය සහ ඉතිරිකිරීම්
  - උත්සාහය, ධෛර්යය සහ සහෝදරයන්
  - නිවස සහ සිතේ සැනසීම
  - ඉගෙනීම, දරුවන් සහ නිර්මාණශීලීත්වය
  - දෛනික වැඩ සහ ජයගත යුතු අභියෝග
  - හවුල්කාරිත්වය සහ විවාහය
  - වෙනස්වීම් සහ අන් අය සමඟ බෙදාගන්නා දේ
  - වාසනාව, ගුරුවරුන් සහ විශ්වාසයන්
  - වෘත්තිය සහ සමාජ තත්ත්වය
  - ලාභ සහ මිතුරන්
  - විවේකය, වියදම් සහ දුර බැහැර ස්ථාන

