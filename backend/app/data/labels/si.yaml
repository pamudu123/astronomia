  pass_rahu: "රාහු කාලයෙන් ({start} සිට {end} දක්වා) පිටතය."
  pass_tara: "තාරා බලය: මනාලියට {bride_tara}, මනාලයාට {groom_tara}. දෙකම මග හැරිය යුතු ඒවා නොවේ."
  pass_chandra: "චන්ද්‍රයා {moon_sign} රාශියේ සිටී: මනාලියගේ චන්ද්‍ර රාශියෙන් {bride_house} රාශිය, මනාලයාගේ චන්ද්‍ර රාශියෙන් {groom_house} රාශිය. කිසිවක් 6, 8 හෝ 12 නොවේ."
  pass_lagna: "ලග්නය {lagna} ය. එයින් 7 වැනි භාවයේ රවි, කුජ, ශනි, රාහු හෝ කේතු නැත."
  pass_planets: "සිකුරු සහ ගුරු සූර්යයාට ඉතා ළං නොවේ (අස්ත නොවේ)."
  weekday_weak: "{weekday} පිළිගන්නේ සමහර මූලාශ්‍ර පමණි."
  thithi_weak: "{thithi} සමහර මූලාශ්‍ර මග හරියි."
  yoga_weak: "යෝගය {yoga} ය. සමහර මූලාශ්‍ර එය අසුබ ලෙස සලකයි."
  dark_half: "චන්ද්‍රයා අඩු වෙමින් පවතී (අව පක්ෂය). විවාහ ගිවිසුමට සමහරු පුර පක්ෂයට කැමතිය."
  tara_janma: "එදින නැකත ඔබ දෙදෙනාගෙන් කෙනෙකුගේ උපන් නැකතයි (ජන්ම තාරාව). සමහරු එය මග හරිති."
  note: "මෙම දින සාමාන්‍ය නීති සහ ඔබේ උපන් නැකත් අනුව සොයා ඇත. සැලසුම් කිරීමට පෙර දිනය සහ වේලාව ඔබේ ජ්‍යොතිෂවේදියා සමඟ තහවුරු කරගන්න."
  none: "මෙම කාල සීමාවේ සියලු නීති සපුරන දිනයක් නැත. දිගු කාල සීමාවක් උත්සාහ කරන්න."
