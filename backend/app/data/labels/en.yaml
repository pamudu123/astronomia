porondam_factor:
  dina: {name: Nakath, meaning: Health and long life}
  gana: {name: Gana, meaning: Temperament}
  mahendra: {name: Mahendra, meaning: Family growth}
  stree_deergha: {name: Stree Deergha, meaning: Wellbeing of the bride}
  yoni: {name: Yoni, meaning: Physical compatibility}
  rashi: {name: Rashi, meaning: Emotional bond}
  rashyadhipathi: {name: Rashyadhipathi, meaning: Rulers of the two signs}
  vashya: {name: Vashya, meaning: Mutual attraction}
  gothra: {name: Gothra, meaning: Family lineage}
  pakshi: {name: Pakshi, meaning: Harmony between the two}
  linga: {name: Linga, meaning: Masculine and feminine nature}
  weekday: {name: Dina, meaning: The days of birth}
  varna: {name: Varna, meaning: Temperament and outlook}
  bhuta: {name: Bhutha, meaning: The five elements}
  vruksha: {name: Vruksha, meaning: Family growth through children}
  ayusha: {name: Ayusha, meaning: Long life}
  graha: {name: Graha, meaning: The ruling planets of both charts}
  nadi: {name: Nadi, meaning: Health of the family line}
  rajju: {name: Rajju, meaning: Long life of the couple}
  vedha: {name: Vedha, meaning: Stars that must not afflict each other}

porondam_reason:
  dina_pass: "Counting from the bride's star, the groom's is number {count}. The remainder after nine is {remainder}, which is favourable."
  dina_fail: "Counting from the bride's star, the groom's is number {count}. The remainder after nine is {remainder}, which is not favourable."
  gana_pass: "The bride is {bride_gana} gana and the groom is {groom_gana} gana. These go together."
  gana_fail: "The bride is {bride_gana} gana and the groom is {groom_gana} gana. These are not counted as a good pair."
  mahendra_pass: "The groom's star is number {count} from the bride's, one of the counts that favour family growth."
  mahendra_fail: "The groom's star is number {count} from the bride's, which is not one of the favourable counts."
  stree_deergha_pass: "The groom's star is number {count} from the bride's, more than {threshold}, which is far enough."
  stree_deergha_fail: "The groom's star is number {count} from the bride's, not more than {threshold}, which is too close."
  yoni_pass: "The animal of the bride's star is the {bride_yoni} and of the groom's the {groom_yoni}. They are not enemies."
  yoni_fail: "The animal of the bride's star is the {bride_yoni} and of the groom's the {groom_yoni}. They are counted as enemies."
  rashi_pass: "The groom's Moon sign is number {count} from the bride's, which is favourable."
  rashi_fail: "The groom's Moon sign is number {count} from the bride's, which is a difficult distance."
  rashyadhipathi_pass: "{bride_lord} rules the bride's sign and {groom_lord} the groom's. They are not enemies."
  rashyadhipathi_fail: "{bride_lord} rules the bride's sign and {groom_lord} the groom's. They are counted as enemies."
  vashya_pass: "One of the two signs, {bride_sign} and {groom_sign}, is under the influence of the other."
  vashya_fail: "Neither sign, {bride_sign} or {groom_sign}, is under the influence of the other."
  gothra_pass: "The bride's star is of the {bride_gothra} gothra and the groom's of the {groom_gothra} gothra. A different gothra is favourable."
  gothra_fail: "Both stars are of the {bride_gothra} gothra. The same gothra is not favourable."
  pakshi_pass: "The bird of the bride's star is the {bride_pakshi} and of the groom's the {groom_pakshi}. They are not enemies."
  pakshi_fail: "The bird of the bride's star is the {bride_pakshi} and of the groom's the {groom_pakshi}. They are counted as enemies."
  linga_pass: "The bride's star is {bride_linga} and the groom's is {groom_linga}. This pair agrees."
  linga_fail: "The bride's star is {bride_linga} and the groom's is {groom_linga}. This pair does not agree."
  weekday_pass: "The bride was born on a {bride_weekday} and the groom on a {groom_weekday}. These days agree."
  weekday_fail: "The bride was born on a {bride_weekday} and the groom on a {groom_weekday}. The groom's day is one or two days before the bride's, which does not agree."
  weekday_unchecked: "This needs the birth dates of both people, so it is not counted when matching by birth stars only."
  varna_pass: "The bride's Moon sign is of the {bride_varna} varna and the groom's of the {groom_varna} varna. The groom's is the same or higher, which agrees."
  varna_fail: "The bride's Moon sign is of the {bride_varna} varna and the groom's of the {groom_varna} varna. The groom's is lower, which does not agree."
  bhuta_pass: "The bride's star is of {bride_bhuta} and the groom's of {groom_bhuta}. These elements are not opposed."
  bhuta_fail: "The bride's star is of {bride_bhuta} and the groom's of {groom_bhuta}. Water and fire are opposed, which does not agree."
  vruksha_pass: "The tree of the bride's star is a {bride_vruksha} tree and of the groom's a {groom_vruksha} tree. This pair agrees."
  vruksha_fail: "Both stars have hard trees. This pair does not agree."
  ayusha_pass: "The two stars are {distance} apart in the count of 28 stars, which agrees."
  ayusha_fail: "The two stars are {distance} apart in the count of 28 stars. Three to five apart does not agree."
  graha_pass: "{positive} of the 4 checks between the lagna lords ({bride_lagna_lord} and {groom_lagna_lord}) and the Moon sign lords ({bride_moon_lord} and {groom_moon_lord}) are friendly or neutral, which agrees."
  graha_fail: "Only {positive} of the 4 checks between the lagna lords ({bride_lagna_lord} and {groom_lagna_lord}) and the Moon sign lords ({bride_moon_lord} and {groom_moon_lord}) are friendly or neutral. At least 2 are needed."
  graha_unchecked: "This needs the birth details of both people, so it is not counted when matching by birth stars only."
  nadi_pass: "The bride is {bride_nadi} nadi and the groom is {groom_nadi} nadi. Different nadi is favourable."
  nadi_fail: "Both are {bride_nadi} nadi. The same nadi is not favourable."
  rajju_pass: "The bride's star is in the {bride_rajju} rajju and the groom's in the {groom_rajju} rajju. Different rajju is essential."
  rajju_fail: "Both stars are in the {bride_rajju} rajju. This essential check does not pass."
  vedha_pass: "{bride_star} and {groom_star} are not an afflicting pair."
  vedha_fail: "{bride_star} and {groom_star} are an afflicting pair. This essential check does not pass."
  summary_majority_pass: "More than half of the factors agree, and both essential checks pass."
  summary_minority_pass: "Both essential checks pass, but fewer than half of the factors agree."
  summary_essential_fail: "An essential check does not pass. Tradition treats this seriously, whatever the count."
  same_star: "Both have the same birth star. Traditions differ on this case, so an astrologer should review it."
  kuja_both: "Both charts show Kuja dosha, so they are often read as balancing each other."
  kuja_neither: "Neither chart shows Kuja dosha."
  kuja_bride_only: "The bride's chart shows Kuja dosha and the groom's does not. This is something to review."
  kuja_groom_only: "The groom's chart shows Kuja dosha and the bride's does not. This is something to review."

