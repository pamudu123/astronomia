# English labels. Keys must match si.yaml exactly (a test checks this).
rashi:
  mesha: {name: Mesha, western: Aries}
  vrishabha: {name: Vrishabha, western: Taurus}
  mithuna: {name: Mithuna, western: Gemini}
  kataka: {name: Kataka, western: Cancer}
  simha: {name: Simha, western: Leo}
  kanya: {name: Kanya, western: Virgo}
  tula: {name: Tula, western: Libra}
  vrischika: {name: Vrischika, western: Scorpio}
  dhanu: {name: Dhanu, western: Sagittarius}
  makara: {name: Makara, western: Capricorn}
  kumbha: {name: Kumbha, western: Aquarius}
  meena: {name: Meena, western: Pisces}

nakshatra:
  ashwini: Ashwini
  bharani: Bharani
  krittika: Krittika
  rohini: Rohini
  mrigashira: Mrigashira
  ardra: Ardra
  punarvasu: Punarvasu
  pushya: Pushya
  ashlesha: Ashlesha
  magha: Magha
  purva_phalguni: Purva Phalguni
  uttara_phalguni: Uttara Phalguni
  hasta: Hasta
  chitra: Chitra
  swati: Swati
  vishakha: Vishakha
  anuradha: Anuradha
  jyeshtha: Jyeshtha
  mula: Mula
  purva_ashadha: Purva Ashadha
  uttara_ashadha: Uttara Ashadha
  shravana: Shravana
  dhanishta: Dhanishta
  shatabhisha: Shatabhisha
  purva_bhadrapada: Purva Bhadrapada
  uttara_bhadrapada: Uttara Bhadrapada
  revati: Revati

planet:
  sun: {name: Sun, short: Su}
  moon: {name: Moon, short: Mo}
  mars: {name: Mars, short: Ma}
  mercury: {name: Mercury, short: Me}
  jupiter: {name: Jupiter, short: Ju}
  venus: {name: Venus, short: Ve}
  saturn: {name: Saturn, short: Sa}
  rahu: {name: Rahu, short: Ra}
  ketu: {name: Ketu, short: Ke}

point:
  lagna: the lagna
  moon: the Moon
  venus: Venus

reason:
  kuja_present: "Mars is in the {house} house counted from {point}."
  kuja_absent: "Mars is not in a house that counts, from the lagna, the Moon or Venus."
  kuja_reduced: "Some conditions that reduce it apply. An astrologer should review it."
  kuja_cancel_lagna_kataka_simha: "The lagna is {sign}, where Mars is counted as helpful."
  kuja_cancel_mars_own_or_exalted: "Mars is in {sign}, its own or exalted sign."
  kuja_cancel_jupiter_aspects_mars: "Jupiter in {jupiter_sign} looks at Mars in {mars_sign}."
  kuja_cancel_mars_house_sign_exception: "Mars in the {house} house in {sign} is not counted."
  kuja_not_lagna_kataka_simha: "The lagna is {sign}."
  kuja_not_mars_own_or_exalted: "Mars is in {sign}, which is neither its own nor its exalted sign."
  kuja_not_jupiter_aspects_mars: "Jupiter in {jupiter_sign} does not look at Mars in {mars_sign}."
  kuja_not_mars_house_sign_exception: "This exception does not cover Mars in the {house} house in {sign}."
  time_stable: "The lagna and birth star stay the same even if the time is off by 15 minutes."
  time_lagna: "The lagna changes if the birth time is off by {minutes} minutes. Check the time."
  time_nakshatra: "The birth star changes if the birth time is off by {minutes} minutes."

kuja_rule:
  lagna_kataka_simha: The lagna is Kataka or Simha
  mars_own_or_exalted: Mars is in its own or exalted sign
  jupiter_aspects_mars: Jupiter looks at Mars
  mars_house_sign_exception: Mars is in a sign that is excused for its house

# Ordinal house numbers, 1 to 12.
house: [1st, 2nd, 3rd, 4th, 5th, 6th, 7th, 8th, 9th, 10th, 11th, 12th]
