# Run both apps locally:  docker compose up --build
# Site: http://localhost:3000   API: http://localhost:8000/docs
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_URL: http://backend:8000
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
