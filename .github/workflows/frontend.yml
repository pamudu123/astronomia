name: Frontend

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "frontend/**"
      - "design/assets/web/**"
      - "backend/openapi.json"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: API types are up to date
        run: |
          npm run gen:types
          git diff --exit-code lib/api-types.ts
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser tests
        run: npx playwright test --trace off
