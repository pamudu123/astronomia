name: Frontend

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "frontend/**"
      - "design/assets/web/**"
      - "backend/openapi.json"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: API types are up to date
        run: |
          npm run gen:types
          git diff --exit-code lib/api-types.ts
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          # A stand-in Supabase that the browser tests answer themselves (tests/e2e/supabase.ts).
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.e2e.test
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_e2e
      - name: Build with the AI switched on, for tests/e2e/ai.spec.ts
        run: npm run build
        env:
          NEXT_DIST_DIR: .next-ai
          AGENT_URL: http://127.0.0.1:9/agent
      - name: Browser tests
        run: npx playwright test --trace off
      - name: Keep test results when browser tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7

