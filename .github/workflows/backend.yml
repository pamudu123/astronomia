name: Backend

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The share store is tested against a real PostgreSQL as well as SQLite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: astro
          POSTGRES_PASSWORD: astro
          POSTGRES_DB: astro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ASTRONOMIA_TEST_DATABASE_URL: postgresql://astro:astro@localhost:5432/astro_test
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for the PDF reports
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy app tests scripts
      - name: Tests
        run: uv run pytest
      - name: API description is up to date
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code openapi.json

  # The image Render runs: build it, start it, and check a chart and a PDF work inside it.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t astronomia-api .
      - name: Start it
        run: docker run -d --name api -e PORT=9000 -p 9000:9000 astronomia-api
      - name: It answers
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/healthz && break
            sleep 2
          done
          curl -sf http://localhost:9000/healthz
      - name: A chart and a PDF work inside the image
        run: |
          body='{"date":"1995-04-19","time":"14:35","place_id":1241622,"lang":"si"}'
          curl -sf -X POST http://localhost:9000/v1/hadahan -H 'content-type: application/json' -d "$body" | grep -q '"lagna"'
          curl -sf -X POST http://localhost:9000/v1/reports/pdf -H 'content-type: application/json' \
            -d "{\"kind\":\"hadahan\",\"name\":\"\",\"birth\":$body}" -o report.pdf
          head -c 4 report.pdf | grep -q '%PDF'
      - name: Logs if it failed
        if: failure()
        run: docker logs api || true
