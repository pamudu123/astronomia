name: Backend

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The share store is tested against a real PostgreSQL as well as SQLite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: astro
          POSTGRES_PASSWORD: astro
          POSTGRES_DB: astro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ASTRONOMIA_TEST_DATABASE_URL: postgresql://astro:astro@localhost:5432/astro_test
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for the PDF reports
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy app tests scripts
      - name: Tests
        run: uv run pytest
      - name: API description is up to date
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code openapi.json
